<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IXL || </title>
    <style>
        /* Base Matrix Theme */
        body, html { 
            margin: 0; 
            padding: 0; 
            font-family: 'Courier New', Courier, monospace; 
            background-color: #050505; 
            color: #00ff41; 
            height: 100%; 
            overflow-x: hidden; 
        }
        
        /* CRT Scanline Effect */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 9999;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* Header / Navbar */
        .dash-header { 
            background: #000; 
            border-bottom: 2px solid #00ff41; 
            padding: 15px 30px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.2); 
            position: relative;
            z-index: 10;
        }
        .dash-header .logo-area { 
            font-size: 22px; 
            font-weight: bold;
            text-shadow: 0 0 5px #00ff41;
            letter-spacing: 2px;
        }
        .dash-header .logo-area span { color: #008f11; }
        
        .logout-btn { 
            background: #000; 
            color: #00ff41; 
            padding: 8px 16px; 
            border: 1px solid #00ff41;
            font-family: inherit;
            font-size: 14px; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .logout-btn:hover { 
            background: #00ff41; 
            color: #000;
            box-shadow: 0 0 10px #00ff41;
        }

        /* Main Container */
        .dash-container { 
            max-width: 1000px; 
            margin: 40px auto; 
            padding: 0 20px; 
            position: relative;
            z-index: 10;
        }
        .path-title { 
            font-size: 20px; 
            margin-bottom: 30px; 
            font-weight: bold; 
            border-bottom: 1px dashed #008f11; 
            padding-bottom: 10px; 
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .path-title::before { 
            content: "C:\\> "; 
            color: #008f11;
        }
        
        /* Game Grid */
        .game-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); 
            gap: 25px; 
        }
        .game-tile { 
            background: rgba(0, 20, 0, 0.5); 
            border: 1px solid #008f11; 
            padding: 15px; 
            text-align: center; 
            cursor: pointer; 
            height: 160px; 
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            box-sizing: border-box; 
            transition: all 0.2s; 
            position: relative;
            overflow: hidden;
        }
        .game-tile:hover { 
            border-color: #00ff41; 
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.3) inset, 0 0 10px rgba(0, 255, 65, 0.2);
            transform: translateY(-2px);
        }
        /* Glitch bar hover effect */
        .game-tile::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 2px;
            background: #00ff41;
            transition: left 0.3s ease-out;
        }
        .game-tile:hover::before { left: 0; }
        
        .tile-img { 
            width: 100%; 
            height: 80px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 32px; 
            background: rgba(0, 255, 65, 0.05); 
            border-bottom: 1px solid #008f11;
        }
        .tile-title { 
            font-size: 13px; 
            font-weight: bold; 
            margin-top: 10px; 
            text-transform: uppercase;
            word-wrap: break-word;
        }

        /* --- GAME PLAYER MODAL --- */
        #gamePlayerModal { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: #000; 
            display: none; 
            flex-direction: column; 
            z-index: 3000; 
            padding: 10px; 
            box-sizing: border-box; 
        }
        .player-top-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 10px; 
            background: #050505; 
            padding: 10px 20px; 
            border: 1px solid #008f11; 
        }
        .back-btn { 
            background: transparent; 
            color: #00ff41; 
            border: 1px solid #00ff41; 
            padding: 8px 16px; 
            cursor: pointer; 
            font-family: inherit;
            font-weight: bold; 
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .back-btn:hover { 
            background: #00ff41; 
            color: #000; 
        }
        .warning-text { 
            color: #ff003c; 
            font-weight: bold; 
            font-size: 14px; 
            letter-spacing: 1px; 
            text-transform: uppercase;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; text-shadow: 0 0 5px #ff003c; } 50% { opacity: 0.5; text-shadow: none; } }

        .iframe-wrapper { 
            position: relative; 
            flex-grow: 1; 
            background: #000; 
            border: 1px solid #008f11; 
        }
        .iframe-wrapper iframe { 
            width: 100%; height: 100%; 
            border: none; 
            background: #fff; /* White background prevents transparent games from disappearing */
        }

        /* Loading Spinner Screen */
        #loadingScreen { 
            position: absolute; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: #000; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            z-index: 10; 
            font-weight: bold; 
            font-size: 16px; 
            gap: 15px; 
            transition: opacity 0.3s ease; 
        }
        .spinner { 
            width: 40px; height: 40px; 
            border: 3px solid #003300; 
            border-top: 3px solid #00ff41; 
            border-radius: 50%; 
            animation: spin 0.8s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .typing-cursor::after {
            content: '_';
            animation: blink 1s infinite;
        }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>

    <div id="dashboardView">
        <div class="dash-header">
            <div class="logo-area">
                SYS.<span>ADMIN</span> // TERMINAL
            </div>
            <button class="logout-btn" onclick="alert('CONNECTION_TERMINATED')">Disconnect</button>
        </div>

        <div class="dash-container">
            <div class="path-title typing-cursor">execute_modules.bat</div>
            
            <div class="game-grid">
                <!-- Executable Embeds -->
                <div class="game-tile" onclick="launchGame('https://cookie-clicker2.com/')">
                    <div class="tile-img">🍪</div>
                    <div class="tile-title">ck_clicker.exe</div>
                </div>
                
                <div class="game-tile" onclick="launchGame('https://chromedino.com/')">
                    <div class="tile-img">🦖</div>
                    <div class="tile-title">run_dino.bat</div>
                </div>

                <div class="game-tile" onclick="launchGame('https://thornandballoons.com/game/index.html')">
                    <div class="tile-img">🎈</div>
                    <div class="tile-title">pop_script.sh</div>
                </div>

                <div class="game-tile" onclick="launchGame('https://snake.io/')">
                    <div class="tile-img">🐍</div>
                    <div class="tile-title">snake_protocol.sys</div>
                </div>

                <div class="game-tile" onclick="launchGame('https://classic.minecraft.net/')">
                    <div class="tile-img">⛏️</div>
                    <div class="tile-title">mine_craft.jar</div>
                </div>

                <!-- Direct Link (Opens in new tab) -->
                <div class="game-tile" onclick="window.open('https://www.roblox.com/home', '_blank')">
                    <div class="tile-img" style="filter: grayscale(100%) sepia(100%) hue-rotate(80deg);">🟥</div>
                    <div class="tile-title">rbx_client.exe</div>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= GAME PLAYER MODAL ================= -->
    <div id="gamePlayerModal">
        <div class="player-top-bar">
            <button onclick="closeGamePlayer()" class="back-btn">&larr; END_PROCESS</button>
            <div class="warning-text">WARNING: VOLATILE MEMORY // DATA WILL NOT SAVE</div>
        </div>
        <div class="iframe-wrapper">
            <div id="loadingScreen">
                <div class="spinner"></div>
                <div class="typing-cursor">INITIALIZING_MODULE...</div>
            </div>
            <iframe id="arcadeFrame" src="" onload="hideLoader()" allowfullscreen></iframe>
        </div>
    </div>

    <!-- ================= SCRIPTS ================= -->
    <script>
        // Launch Game in Fullscreen Modal
        function launchGame(url) {
            const loader = document.getElementById('loadingScreen');
            loader.style.display = 'flex';
            loader.style.opacity = '1';
            
            document.getElementById('arcadeFrame').src = url;
            document.getElementById('gamePlayerModal').style.display = 'flex';
        }

        // Hide Spinner when iframe is loaded
        function hideLoader() {
            const loader = document.getElementById('loadingScreen');
            loader.style.opacity = '0';
            setTimeout(() => {
                if(loader.style.opacity === '0') {
                    loader.style.display = 'none';
                }
            }, 300);
        }

        // Close Game Modal
        function closeGamePlayer() {
            document.getElementById('arcadeFrame').src = '';
            document.getElementById('gamePlayerModal').style.display = 'none';
        }
    </script>
</body>
</html>
