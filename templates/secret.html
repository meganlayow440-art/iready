<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secret Portal - Games</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #121212; 
            color: #e0e0e0; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        h1 { color: #44d5ff; font-size: 32px; margin-bottom: 10px; }
        p { font-size: 16px; color: #aaa; margin-top: 0; }
        
        .nav-bar { 
            margin-bottom: 20px; 
            display: flex; 
            gap: 10px; 
            flex-wrap: wrap; 
            justify-content: center; 
        }
        .game-btn { 
            background-color: #222; 
            color: #44d5ff; 
            border: 1px solid #44d5ff; 
            padding: 8px 16px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
        }
        .game-btn:hover { 
            background-color: #44d5ff; 
            color: #121212; 
        }
        
        .game-container { 
            width: 100%; 
            max-width: 900px; 
            height: 550px; 
            background: #1e1e1e; 
            border: 2px solid #333; 
            border-radius: 8px; 
            overflow: hidden; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
        }
        iframe { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
        
        .logout-btn { 
            margin-top: 25px; 
            background-color: #ff4d4d; 
            color: white; 
            padding: 8px 16px; 
            text-decoration: none; 
            border-radius: 4px; 
            font-weight: bold; 
            font-size: 14px; 
        }
    </style>
</head>
<body>
    <h1>Secret Game Portal</h1>
    <p>Select a game below to play:</p>
    
    <div class="nav-bar">
        <button class="game-btn" onclick="loadGame('https://mariosbasement.github.io/retro-bowl/')">Retro Bowl</button>
        <button class="game-btn" onclick="loadGame('https://2048game.com/')">2048</button>
        <button class="game-btn" onclick="loadGame('https://www.google.com/logos/2010/pacman10-i.html')">Pac-Man</button>
        <button class="game-btn" onclick="loadGame('https://t-rex-runner.com/')">Dino Runner</button>
    </div>

    <div class="game-container">
        <iframe id="gameFrame" src="https://2048game.com/"></iframe>
    </div>

    <a href="/logout" class="logout-btn">Log Out</a>

    <script>
        function loadGame(url) {
            document.getElementById('gameFrame').src = url;
        }
    </script>
</body>
</html>
