<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Local Arcade</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #00ffcc; }
        .game-grid {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        .game-card {
            background: #1e1e1e;
            border: 2px solid #333;
            border-radius: 10px;
            padding: 20px;
            width: 200px;
            cursor: pointer;
            transition: 0.2s;
        }
        .game-card:hover {
            border-color: #00ffcc;
            transform: translateY(-5px);
        }
        iframe {
            width: 100%;
            height: 500px;
            border: none;
            margin-top: 20px;
            display: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1>Local Offline Arcade</h1>
    <p>Select a game to play locally without external servers.</p>

    <div class="game-grid">
        <div class="game-card" onclick="loadGame('cookie/index.html')">
            <h3>Cookie Clicker Clone</h3>
            <p>Local incremental idle game.</p>
        </div>
        <div class="game-card" onclick="loadGame('snake/index.html')">
            <h3>Classic Snake</h3>
            <p>Retro arcade snake game.</p>
        </div>
        <div class="game-card" onclick="loadGame('custom/index.html')">
            <h3>My Custom Game</h3>
            <p>Play our own creation!</p>
        </div>
    </div>

    <iframe id="gameFrame" src=""></iframe>

    <script>
        function loadGame(path) {
            const frame = document.getElementById('gameFrame');
            frame.style.display = 'block';
            frame.src = path;
            frame.scrollIntoView({ behavior: 'smooth' });
        }
    </script>

</body>
</html>
