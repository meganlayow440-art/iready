<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IXL | Skill plan & practice assignment</title>
    <style>
        body { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; margin: 0; padding: 0; background-color: #f7f9fa; color: #333; }
        header { background-color: #55b700; padding: 10px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #489e00; }
        .logo-box { background: #ffcc00; padding: 3px 12px; border-radius: 4px; display: flex; align-items: center; text-decoration: none; border-bottom: 3px solid #dfb200; }
        .logo-text { font-size: 26px; font-weight: 900; color: #000; letter-spacing: -1.5px; }
        
        .account-badge { color: white; font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        
        .main-container { max-width: 900px; margin: 30px auto; background: white; border: 1px solid #cbd5e1; border-radius: 8px; padding: 30px 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
        .practice-header { border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
        .practice-header h2 { margin: 0; color: #0070f3; font-size: 22px; }
        .stats-pill { background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 13px; }

        .question-box { font-size: 18px; color: #1e293b; margin-bottom: 25px; line-height: 1.5; font-weight: 500; }
        .options-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
        .option-item { background: #f8fafc; border: 1px solid #cbd5e1; padding: 12px 18px; border-radius: 6px; cursor: pointer; font-size: 15px; display: flex; align-items: center; gap: 12px; transition: all 0.2s; }
        .option-item:hover { background: #f1f5f9; border-color: #94a3b8; }
        .option-item input { accent-color: #0070f3; }

        .submit-btn { background-color: #0070f3; color: white; border: none; padding: 12px 25px; border-radius: 4px; font-size: 15px; font-weight: bold; cursor: pointer; }
        .submit-btn:hover { background-color: #005bb5; }
        
        .feedback { margin-top: 20px; padding: 15px; border-radius: 6px; font-weight: bold; display: none; }
        .feedback.correct { background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; display: block; }
        .feedback.incorrect { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; display: block; }
        
        .back-link { display: inline-block; margin-top: 30px; color: #0070f3; text-decoration: none; font-size: 14px; font-weight: bold; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo-box"><span class="logo-text">IXL</span></a>
        <div class="account-badge">
            <span>Signed in as: AidenMarcell3</span>
        </div>
    </header>

    <main class="main-container">
        <div class="practice-header">
            <h2>Algebra 1 - S.5 Solve linear equations</h2>
            <div class="stats-pill">SmartScore: 0 / 100</div>
        </div>

        <div class="question-box">
            Solve for $z$: <br><br>
            $$4z - 6 = 22$$
        </div>

        <div class="options-list">
            <label class="option-item"><input type="radio" name="ans" value="a"> A) $z = 5$</label>
            <label class="option-item"><input type="radio" name="ans" value="b"> B) $z = 7$</label>
            <label class="option-item"><input type="radio" name="ans" value="c"> C) $z = 8$</label>
            <label class="option-item"><input type="radio" name="ans" value="d"> D) $z = 11$</label>
        </div>

        <button class="submit-btn" onclick="submitAnswer()">Submit</button>

        <div id="feedbackBox" class="feedback"></div>

        <a href="/" class="back-link">&larr; Return to main menu</a>
    </main>

    <script>
        function submitAnswer() {
            const selected = document.querySelector('input[name="ans"]:checked');
            const feedback = document.getElementById('feedbackBox');
            
            if (!selected) {
                alert("Please select an answer option.");
                return;
            }

            if (selected.value === 'b') {
                feedback.className = "feedback correct";
                feedback.innerHTML = "Correct! Fantastic job! SmartScore increased to 12.";
            } else {
                feedback.className = "feedback incorrect";
                feedback.innerHTML = "Sorry, that's not right. Try reviewing the steps for solving linear equations.";
            }
        }
    </script>
</body>
</html>
